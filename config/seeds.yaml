# Seed entities. The radar grows from here: it follows authors, references, citations and
# social follows of whatever scores high. Handles are optional; any one is enough to watch.
#   github: user/org   hf: HF org   bluesky: handle   feed: RSS/Atom URL   homepage: URL (feed is auto-discovered)
#   arxiv_author: "Last, First" query   s2: Semantic Scholar author id   x: X handle (no @; validated on first X API run)
# Seeds deliberately over-weight small/independent labs and infra; the big labs are here for coverage.

